# .github/workflows/build-and-deploy.yml
# Build the image on GitHub's runners (your server never builds), push to GHCR,
# migrate Supabase, then tell Coolify to pull + redeploy.
#
# Repo -> Settings -> Secrets and variables -> Actions:
#   Secrets:   DATABASE_URL (Supabase session-pooler URL), COOLIFY_WEBHOOK_URL,
#              COOLIFY_TOKEN
#   Variables: NEXT_PUBLIC_FF_API_ORIGIN, NEXT_PUBLIC_STORAGE_BASE_URL
#              (public, non-secret — baked into the image at build)

name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is derived (lowercased) in the first step below — GHCR rejects any
  # uppercase in the repository name, and github.repository keeps "27Works" as-is.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # push to GHCR with GITHUB_TOKEN (no org secret needed)
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64             # your droplet is amd64 — pin it even if you build on Apple Silicon
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_FF_API_ORIGIN=${{ vars.NEXT_PUBLIC_FF_API_ORIGIN }}
            NEXT_PUBLIC_IS_CLOUD=false
            NEXT_PUBLIC_STORAGE_BASE_URL=${{ vars.NEXT_PUBLIC_STORAGE_BASE_URL }}
            NEXT_PUBLIC_GITHUB_APP_NAME=${{ vars.NEXT_PUBLIC_GITHUB_APP_NAME }}

      # Migrate the remote Supabase DB from CI — nothing DB-related runs on the server.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1                         # match root packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Call prisma directly, NOT the repo's `migrate:prod` script: the docs
        # reference a `migrate:deploy` script that doesn't exist, and the real
        # script (`migrate:prod`) is `dotenv -e .env.local -- ...`, which needs a
        # .env.local file absent in CI. Direct call uses the DATABASE_URL above.
        run: |
          pnpm install --frozen-lockfile --filter @workspace/db...
          pnpm --filter @workspace/db exec prisma migrate deploy

      # Tell Coolify to pull :latest and redeploy. URL + token from Coolify:
      #   resource -> Webhooks -> Deploy Webhook, and an API token under Keys & Tokens.
      - name: Trigger Coolify redeploy
        run: |
          curl --fail --request GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
